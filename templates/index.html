
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome | ML Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .welcome-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .welcome-box h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .btn-custom {
      background-color: #fff;
      color: #0d6efd;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-custom:hover {
      background-color: #e7f1ff;
      color: #0a58ca;
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h1>Welcome to the ML Prediction App</h1>
    <p class="lead">Predict student math scores based on their details.</p>
    <a href="{{ url_for('predict_datapoint') }}" class="btn-custom">Go to Prediction Page</a>
  </div>
</body>
</html>
